product_name: DMF Console
facility_name: Lab
catalog_source: config/app-contracts.yaml
# `cluster:` declares WHERE each service runs, so the Facility Detail page can
# look for it in the cluster's own container metrics (kube_pod_container_info)
# instead of inferring presence from an ingress the service may deliberately
# not have — AWX is exactly that case.
#
#   namespace           <- dmf-infra k3s-lab-bootstrap/roles/**/defaults/main.yml
#                          (authentik_namespace, awx_namespace, forgejo_namespace,
#                           grafana_namespace, librenms_namespace, netbox_namespace,
#                           zot_namespace). These are config-verified.
#   image_repositories  <- the repository path of the service's OWN image(s).
#                          Declared as full paths because the path is what a
#                          human checks against upstream — so each one must be
#                          TRUE as written, not merely sufficient to match.
#                          An entry may be a bare path (compared on the image
#                          NAME, the final segment) or a mapping with
#                          `match: exact` (compared on the whole path). See
#                          facility.py's _repository_matches for the trade:
#                          name matching survives dmf-infra playbook 630
#                          replacing a source namespace when it mirrors into
#                          the cluster's Zot; exact matching does not, and is
#                          used only where the image name cannot stand alone.
#
# PROVENANCE of the declared paths — what actually confirms each one:
#   Statically confirmed
#     registry  — pinned in dmf-infra itself
#                 (`zot_image: ghcr.io/project-zot/zot-linux-arm64:v2.1.2`).
#     netbox    — netbox-community/netbox-chart 7.3.0, the chart dmf-infra
#                 deploys and names in its own resource comments.
#     forgejo   — the forgejo chart at the version dmf-infra pins
#                 (`forgejo_chart_version: "16.0.2"`).
#     awx       — consistent with the awx-operator defaults; the operator, not
#                 a values file, chooses the application image.
#   UNPROVEN-LIVE — chart defaults dmf-infra does not override, so nothing in
#   config confirms them and this arc took no live probes:
#     authentik, grafana, librenms.
#
# RESIDUAL ASSUMPTION for every entry that keeps NAME matching: that no OTHER
# vendor's image sharing that basename runs in the same namespace. The names
# carrying it are awx, forgejo, grafana, librenms, netbox and the two zot
# variants — all project-distinctive. Authentik's is not (`goauthentik/server`
# reduces to `server`), so it alone declares `match: exact`; nothing else
# named `server` runs there today, but that is contingent state rather than a
# property, and the strict rule is the fail-closed choice.
#
# A wrong entry, either mode, degrades its row to "no matching pods in cluster
# metrics" — a falsifiable statement about the check, never a claim that the
# service is absent.
#
# An entry with no `cluster:` block is never claimed absent either — the page
# says it has no declared cluster location instead, because "we didn't look"
# and "it isn't there" are different facts (Constitution Art. 1).
apps:
  - key: auth
    display_name: Authentik
    lane: public
    deep_links:
      primary: https://auth.dmf.example.com/
    summary: Identity provider and OIDC source.
    cluster:
      namespace: authentik
      # The only `match: exact` entry. `goauthentik/server` reduces to the
      # basename `server`, which is not project-distinctive, so the standing
      # same-basename/different-vendor assumption the other entries carry does
      # not hold here. Cost, accepted deliberately: an image mirrored to
      # <zot>/dmf/server would stop being recognised, degrading to the
      # falsifiable "no matching pods" statement rather than to a wrong
      # version string beside another vendor's container.
      image_repositories:
        - path: goauthentik/server
          match: exact
  - key: awx
    display_name: AWX
    lane: public
    deep_links:
      primary: https://awx.dmf.example.com/
    summary: Workflow execution and job history.
    cluster:
      namespace: awx
      # The AWX application image only. `ansible/awx-operator` (the operator
      # that installs it) and `ansible/awx-ee` (the execution environment that
      # job pods run in, mirrored to <zot>/dmf/awx-ee by dmf-infra playbook
      # 630) share this namespace and are NOT AWX's own version.
      image_repositories:
        - ansible/awx
  - key: forgejo
    display_name: Forgejo
    lane: public
    deep_links:
      primary: https://forgejo.dmf.example.com/
    summary: Reviewable config and change history.
    cluster:
      namespace: forgejo
      image_repositories:
        - forgejo/forgejo
  - key: grafana
    display_name: Grafana
    lane: private
    deep_links:
      primary: https://grafana.dmf.example.com/
    summary: Deep charts and long-form observability.
    cluster:
      # A shared namespace: prometheus, loki, promtail, blackbox-exporter and
      # dmf-promsd all live here too (grafana_namespace, loki_namespace,
      # promtail_namespace, blackbox_namespace, prometheus_namespace,
      # dmf_promsd_namespace are all `monitoring`). Only grafana/grafana is
      # Grafana.
      namespace: monitoring
      image_repositories:
        - grafana/grafana
  - key: librenms
    display_name: LibreNMS
    lane: private
    deep_links:
      primary: https://librenms.dmf.example.com/
    summary: Network monitoring and device telemetry.
    cluster:
      # dmf-infra's librenms_proxy_image (nginx:1.27-alpine) runs beside it in
      # this namespace and is not LibreNMS's version.
      namespace: librenms
      image_repositories:
        - librenms/librenms
  - key: netbox
    display_name: NetBox
    lane: private
    deep_links:
      primary: https://netbox.dmf.example.com/
    summary: Inventory, topology, and source of truth.
    cluster:
      # The chart also deploys valkey (bitnami/valkey, pinned in dmf-infra's
      # netbox values template) and postgres into this namespace.
      namespace: netbox
      image_repositories:
        - netbox-community/netbox
  - key: registry
    display_name: Registry
    lane: private
    deep_links:
      primary: https://registry.dmf.example.com/
    summary: Image registry and artifact storage.
    cluster:
      namespace: zot
      # dmf-infra bakes the architecture into the image name and does NOT
      # template it (`zot_image: ghcr.io/project-zot/zot-linux-arm64`), so both
      # variants are declared here rather than leaving an amd64 env reading
      # "no matching pods" for a registry that is plainly running.
      image_repositories:
        - project-zot/zot-linux-arm64
        - project-zot/zot-linux-amd64
