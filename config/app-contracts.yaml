product_name: DMF Console
facility_name: Lab
catalog_source: config/app-contracts.yaml
# `cluster:` declares WHERE each service runs, so the Facility Detail page can
# look for it in the cluster's own container metrics (kube_pod_container_info)
# instead of inferring presence from an ingress the service may deliberately
# not have — AWX is exactly that case. Both fields are copied from dmf-infra's
# own role defaults, which are the authority:
#   namespace       <- k3s-lab-bootstrap/roles/**/defaults/main.yml
#                      (authentik_namespace, awx_namespace, forgejo_namespace,
#                       grafana_namespace, librenms_namespace, netbox_namespace,
#                       zot_namespace)
#   image_contains  <- the app's own image repository path, which is what tells
#                      its container apart from the sidecars sharing the same
#                      namespace (a netbox namespace also runs valkey and
#                      postgres; `monitoring` runs prometheus, loki and promtail
#                      alongside grafana). Verified for the registry against
#                      dmf-infra's `zot_image: ghcr.io/project-zot/zot-...`.
# An entry with no `cluster:` block is never claimed absent — the page says it
# has no declared cluster location instead, because "we didn't look" and "it
# isn't there" are different facts (Constitution Art. 1).
apps:
  - key: auth
    display_name: Authentik
    lane: public
    deep_links:
      primary: https://auth.dmf.example.com/
    summary: Identity provider and OIDC source.
    cluster:
      namespace: authentik
      image_contains: authentik
  - key: awx
    display_name: AWX
    lane: public
    deep_links:
      primary: https://awx.dmf.example.com/
    summary: Workflow execution and job history.
    cluster:
      namespace: awx
      image_contains: awx
  - key: forgejo
    display_name: Forgejo
    lane: public
    deep_links:
      primary: https://forgejo.dmf.example.com/
    summary: Reviewable config and change history.
    cluster:
      namespace: forgejo
      image_contains: forgejo
  - key: grafana
    display_name: Grafana
    lane: private
    deep_links:
      primary: https://grafana.dmf.example.com/
    summary: Deep charts and long-form observability.
    cluster:
      namespace: monitoring
      image_contains: grafana
  - key: librenms
    display_name: LibreNMS
    lane: private
    deep_links:
      primary: https://librenms.dmf.example.com/
    summary: Network monitoring and device telemetry.
    cluster:
      namespace: librenms
      image_contains: librenms
  - key: netbox
    display_name: NetBox
    lane: private
    deep_links:
      primary: https://netbox.dmf.example.com/
    summary: Inventory, topology, and source of truth.
    cluster:
      namespace: netbox
      image_contains: netbox
  - key: registry
    display_name: Registry
    lane: private
    deep_links:
      primary: https://registry.dmf.example.com/
    summary: Image registry and artifact storage.
    cluster:
      namespace: zot
      image_contains: zot
