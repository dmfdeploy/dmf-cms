name: DCO
# On a pull request this checks the PR's commits. On a push to main it finds
# the merged PR for the pushed commit and checks that PR's own commits, because
# a rebase merge rewrites SHAs. Logic: scripts/validate_pr_gate.py.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -eu
          # dependabot[bot] cannot sign off commits, so its PRs are exempt. The
          # job still ends in success: a skipped job is not a passed check, and
          # a merge queue that requires every check to succeed would stall.
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot commits are exempt from the sign-off check."
            exit 0
          fi
          python3 scripts/validate_pr_gate.py dco
