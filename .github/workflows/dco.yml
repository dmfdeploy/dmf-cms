name: DCO
# On a pull request this checks the PR's commits. On a push to main it finds
# the merged PR for the pushed commit and checks that PR's own commits, because
# a rebase merge rewrites SHAs. Logic: scripts/validate_pr_gate.py.
#
# Trust: pull_request_target runs this workflow file and the checkout from the
# base branch, so a pull request cannot change the gate that judges it. The job
# never checks out the PR head and runs no PR code. The job name is the
# required status check `dco` in the main-protection ruleset. Keep it.
on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  dco:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Verify Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/validate_pr_gate.py dco
