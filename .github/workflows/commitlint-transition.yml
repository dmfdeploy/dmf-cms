name: commitlint-transition
# Transition only. Until the trusted commitlint.yml (pull_request_target) is
# proven on main, this gives pull requests a commitlint check from the old
# pull_request event, so a pull request that changes the gates still gets its
# own required checks. A follow-up removes this file.
#
# It runs on pull requests only, never on push: a pushed commit must carry
# exactly one check run named commitlint (from commitlint.yml), because the
# release gate refuses two check runs with one name. A job that is skipped on
# push still creates a check run, so the job can't live in a push workflow.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Conventional Commits check (PR commits API)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/validate_pr_gate.py commitlint
