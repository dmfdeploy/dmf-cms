name: hold-disarm
# The `hold` label is the brake that stops a merge. Adding it disarms
# auto-merge at once. The automerge workflow's triggers never fire on label
# events, so this workflow covers them.
#
# Disarming needs no App token. Only a merge must start push workflows
# (dmfdeploy/dmfdeploy#568), and this job never merges. It uses GITHUB_TOKEN
# alone, with `contents: write` and `pull-requests: write`: no checkout, no
# environment, no secrets.
#
# `pull_request_target` runs the workflow definition from the base branch with
# the base repository's token, also for a pull request from a fork. A pull
# request therefore cannot change this job, and a fork pull request that a
# writer armed by hand is disarmed too. The job never checks out or runs pull
# request code. It reads only the label name, for the `if` condition, and the
# pull request URL from the event.
# A failed disarm fails the run so it shows in Actions. The scheduled automerge
# sweep is a fallback only for pull requests that target main, and GitHub can
# delay scheduled runs.
on:
  pull_request_target:
    types: [labeled]
permissions: {}
jobs:
  disarm:
    if: github.event.label.name == 'hold'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --disable-auto "${PR_URL}"
