name: automerge
# Arms rebase auto-merge, or merges a pull request that is already clean, with
# a GitHub App installation token. Merges made with GITHUB_TOKEN start no
# push workflows (dmfdeploy/dmfdeploy#568); merges made for an App do.
#
# Both triggers run from the default branch, so the `automerge` environment
# (limited to main) can release the App key. The workflow never checks out or
# runs pull request code: scripts/automerge.py reads each pull request through
# the API. Labels, draft state and head SHA are never taken from an event
# payload.
#
# - workflow_run: acts on the pull request whose head is the finished run's SHA.
# - schedule: sweeps open pull requests. It covers changes that start no CI
#   run (a draft marked ready, a removed hold label), so a pull request waits
#   at most one interval. GitHub can delay scheduled runs under load.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # Every 10 minutes, off the top of the hour, when scheduled runs queue up.
    - cron: "3,13,23,33,43,53 * * * *"
permissions:
  contents: read
concurrency:
  # One event run per head SHA; one sweep at a time. Runs never cancel, so a
  # started merge call finishes.
  group: automerge-${{ github.event.workflow_run.head_sha || 'sweep' }}
  cancel-in-progress: false
jobs:
  automerge:
    # Skip push runs of CI: they have no pull request to act on.
    if: github.event_name == 'schedule' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automerge
    permissions:
      # GITHUB_TOKEN only lists Actions runs. Every write uses the App token.
      actions: read
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # No checkout. The script comes from the default branch via the
      # GitHub API, pinned to the commit this run executes.
      - name: Fetch automerge script
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_SHA: ${{ github.sha }}
        run: |
          set -eu
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/automerge.py?ref=${SCRIPT_SHA}" \
            > "${RUNNER_TEMP}/automerge.py"
      - name: Arm or merge (workflow_run)
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 "${RUNNER_TEMP}/automerge.py" event --sha "${RUN_HEAD_SHA}"
      - name: Arm or merge (sweep)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
        run: python3 "${RUNNER_TEMP}/automerge.py" sweep
