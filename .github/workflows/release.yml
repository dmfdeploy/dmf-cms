name: release

# Unattended release. When the last required workflow finishes on a push to
# main, `verify` decides whether that commit is a release bump with a fresh
# success for every required context. If it is, `release` builds the image,
# publishes it to GHCR, attests the digest, and creates the v<VERSION> tag
# last, as the release GitHub App.
#
# The workflow has no manual trigger, no inputs, and no user-selected ref. It
# reads the commit from workflow_run.head_sha, never from github.sha, which is
# the head of main and can differ. The plan is dmfdeploy/dmfdeploy#568.
#
# The workflow stays inert until the repository variable RELEASE_ENABLED is
# 'true'. An owner sets that variable at the end of the rollout. While it is
# unset, `verify` is skipped, so `release` is skipped too and nothing runs.

on:
  workflow_run:
    # These are the exact `name:` values of the workflow files. A different
    # spelling starts no run; tests/test_release_workflow.py checks them.
    workflows: [CI, guard, DCO, issue-link]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Readiness only: no environment, no concurrency group, read-only token. A
    # push that is not a release bump, and a run that is not the last required
    # workflow to complete, ends here without failing.
    if: >-
      vars.RELEASE_ENABLED == 'true'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout the gate script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Decide readiness for the triggering commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/release-gate.py verify --sha "$RELEASE_SHA"

  release:
    # Runs on GitHub's hosted arm64 runner so the build is native linux/arm64,
    # the platform of the k3s nodes. Do not move it to an amd64 runner: the image
    # would be amd64 (the first unattended release, v0.40.1, was).
    # The only job with write permissions, the release environment, and the
    # concurrency group. It takes the SHA from `verify` and nothing else, then
    # repeats checks 1 to 3 from that SHA.
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: release
    concurrency:
      group: dmf-cms-release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      # The gate script comes from the head of main. The source to build comes
      # from the verified commit. Separate paths keep the source tree clean.
      - name: Checkout the gate script from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: tools
          persist-credentials: false

      - name: Checkout the verified release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: src
          persist-credentials: false

      - name: Checkout the shared GHCR publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: dmfdeploy/dmfdeploy
          ref: 28dc456f1ff64899b73d1445f5d5d9759199062c
          path: umbrella
          persist-credentials: false

      - name: Repeat checks 1 to 3 from the SHA alone
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/release-gate.py check --sha "$RELEASE_SHA"

      - name: Check version order and tag state
        id: version_rule
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/release-gate.py version-rule --sha "$RELEASE_SHA"

      # Mint the token before any build, so a missing or expired key fails the
      # run while nothing has been pushed. The key goes in as a step input,
      # never through `env` (ADR-0007).
      - name: Mint the release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The runner is arm64, so arm64 builds natively. QEMU supplies the foreign
      # amd64 platform; the frontend stage always builds natively.
      - name: Set up QEMU for the amd64 build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: amd64

      - name: Build the arm64 image from the verified commit
        working-directory: src
        run: |
          set -eu
          [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ]
          scripts/build-image.sh --no-hint --platform linux/arm64 --tag-suffix -arm64

      - name: Build the amd64 image from the verified commit
        working-directory: src
        run: scripts/build-image.sh --no-hint --platform linux/amd64 --tag-suffix -amd64

      - name: Check each image's platform, labels and start-up before any push
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -eu
          for arch in arm64 amd64; do
            image="registry.dmf.example.com/dmf-cms:$RELEASE_VERSION-$arch"
            platform="$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')"
            docker image inspect "$image" --format '{{json .Config.Labels}}' \
              | python3 tools/scripts/release-gate.py check-labels \
                  --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" \
                  --platform "$platform" --expect "linux/$arch"
            docker run --rm --platform "linux/$arch" "$image" python -c 'import dmf_cms'
          done

      - name: Check for an existing GHCR index
        id: ghcr_image
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: python3 tools/scripts/release-gate.py inspect-ghcr --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"

      # Each platform goes up under a staging tag through the shared helper. A
      # re-run replaces a staging tag with a rebuild of the same verified
      # commit. The version tag is never replaced: it exists only as the index.
      - name: Publish the verified arm64 image to GHCR
        if: steps.ghcr_image.outputs.exists != 'true'
        working-directory: src
        env:
          RELEASE_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG_SUFFIX: -arm64
          # GitHub-hosted Ubuntu provides Docker on the standard socket. The
          # shared helper otherwise defaults to an operator's Colima socket.
          DOCKER_HOST: unix:///var/run/docker.sock
          DMFDEPLOY_UMBRELLA: ${{ github.workspace }}/umbrella
        run: |
          set -eu
          publisher_token="$RELEASE_TOKEN"
          unset RELEASE_TOKEN
          printf '%s\n' "$publisher_token" | scripts/publish-to-ghcr.sh

      - name: Publish the verified amd64 image to GHCR
        if: steps.ghcr_image.outputs.exists != 'true'
        working-directory: src
        env:
          RELEASE_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG_SUFFIX: -amd64
          DOCKER_HOST: unix:///var/run/docker.sock
          DMFDEPLOY_UMBRELLA: ${{ github.workspace }}/umbrella
        run: |
          set -eu
          publisher_token="$RELEASE_TOKEN"
          unset RELEASE_TOKEN
          printf '%s\n' "$publisher_token" | scripts/publish-to-ghcr.sh

      - name: Read the pushed platform digests
        id: platform_digests
        if: steps.ghcr_image.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -eu
          for arch in arm64 amd64; do
            docker image inspect "ghcr.io/dmfdeploy/dmf-cms:$RELEASE_VERSION-$arch" \
              --format '{{json .RepoDigests}}' \
              | python3 tools/scripts/release-gate.py digest --name "$arch"
          done

      - name: Join the platforms into one index under the version tag
        if: steps.ghcr_image.outputs.exists != 'true'
        working-directory: src
        env:
          RELEASE_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          ARM64_DIGEST: ${{ steps.platform_digests.outputs.arm64 }}
          AMD64_DIGEST: ${{ steps.platform_digests.outputs.amd64 }}
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          set -eu
          publisher_token="$RELEASE_TOKEN"
          unset RELEASE_TOKEN
          printf '%s\n' "$publisher_token" \
            | scripts/publish-index-to-ghcr.sh --arm64 "$ARM64_DIGEST" --amd64 "$AMD64_DIGEST"

      - name: Verify the published index
        id: index
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: python3 tools/scripts/release-gate.py verify-index --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"

      # One attestation on the index digest. Verifying the version tag resolves
      # to that digest. The per-platform digests carry no attestation of their
      # own; copy the index whole (all platforms) to keep its digest.
      - name: Attest build provenance for the index digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/dmfdeploy/dmf-cms
          subject-digest: ${{ steps.index.outputs.index_digest }}

      # Last. The App token creates the tag; GITHUB_TOKEN only reads. This step
      # repeats checks 1 to 4 immediately before it creates the ref.
      - name: Create the release tag as the release App
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_TOKEN: ${{ steps.app_token.outputs.token }}
        run: python3 tools/scripts/release-gate.py tag --sha "$RELEASE_SHA"
