name: issue-link
# Split out of guard.yml deliberately. This gate reads the PR body and labels
# from the EVENT PAYLOAD, and its failure message tells you to edit the body or
# add the 'no-issue' label — neither of which fires a run under the default
# pull_request types, while re-running the job replays the original payload. So
# it needs `edited`/`labeled`/`unlabeled` for its own advertised remedies to work.
#
# It lives here rather than widening guard.yml's triggers because guard.yml also
# runs gitleaks and trivy: adding those types there would re-run a full secret
# scan and a vulnerability scan on every body edit and every label change. The
# checkout is only for the validation script, so triggering it often costs
# approximately nothing.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # A push to main finds the merged PR for the pushed commit and checks its
  # body and labels, so the context completes on the shipped SHA too.
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: issue-link-${{ github.ref }}
  cancel-in-progress: true
jobs:
  issue-link:
    # Working-model gate (umbrella issue dmfdeploy/dmfdeploy#32): every PR must
    # reference its tracking issue in the canonical backlog FULLY QUALIFIED —
    # bare #N resolves to this repo's own issues and silently misses. Trivial
    # changes: add the no-issue label.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: PR references a canonical-backlog issue (qualified)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: python3 scripts/validate_pr_gate.py issue-link
