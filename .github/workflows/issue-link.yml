name: issue-link
# Split out of guard.yml deliberately. This gate reads the PR body and labels
# from the API at run time, not from the event payload, because a payload can
# predate a label added at once. Its failure message tells you to edit the body
# or add the 'no-issue' label, and neither fires a run under the default
# pull_request_target types. So it needs `edited`/`labeled`/`unlabeled` for its
# own advertised remedies to work.
#
# It lives here rather than widening guard.yml's triggers because guard.yml also
# runs gitleaks and trivy: adding those types there would re-run a full secret
# scan and a vulnerability scan on every body edit and every label change. The
# checkout is only for the validation script, so triggering it often costs
# approximately nothing.
#
# Trust: pull_request_target runs this workflow file and the checkout from the
# base branch, so a pull request cannot change the gate that judges it. The job
# never checks out the PR head and runs no PR code. The job name is the
# required status check `issue-link` in the main-protection ruleset. Keep it.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # A push to main finds the merged PR for the pushed commit and checks its
  # body and labels, so the context completes on the shipped SHA too.
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
# One group per pull request (or per pushed commit), so a newer run for the same
# pull request cancels an older one and only the current validation can satisfy
# the required check. github.ref won't do: under pull_request_target it is the
# base branch for every pull request, so it would cancel other pull requests' runs.
concurrency:
  group: issue-link-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  issue-link:
    # Working-model gate (umbrella issue dmfdeploy/dmfdeploy#32): every PR must
    # reference its tracking issue in the canonical backlog FULLY QUALIFIED —
    # bare #N resolves to this repo's own issues and silently misses. Trivial
    # changes: add the no-issue label.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: PR references a canonical-backlog issue (qualified)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/validate_pr_gate.py issue-link
