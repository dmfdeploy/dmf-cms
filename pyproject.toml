[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmf-cms"
version = "0.43.3"
description = "DMF Console - operator-facing control surface for the dmfdeploy platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff==0.17.6",
]

[tool.ruff]
# CI checks the umbrella repo out into .umbrella; its scripts aren't this repo's code.
extend-exclude = [".umbrella"]

[tool.ruff.lint]
select = [
  # Blanket noqa comments, and noqa codes that no longer apply.
  "PGH004", "RUF100",
  # Complexity, branches, arguments, and statements, at ruff's default limits.
  "C901", "PLR0912", "PLR0913", "PLR0915",
]
# Codes that existing noqa comments name, for rules that this repo doesn't run.
external = ["BLE001", "E402"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dmf_cms = ["static/app/*.html", "static/app/*.js", "static/app/*.css"]
